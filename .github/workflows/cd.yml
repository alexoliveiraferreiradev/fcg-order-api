name: CI/CD Fiap Cloud Games - Order Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Um run por branch: em PR o novo cancela o antigo; na main o deploy em andamento termina antes do próximo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 9.0.x
  SOLUTION: Fcg.Orders.sln
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name:  Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Restore 
        run: dotnet restore ${{ env.SOLUTION }}
      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration ${{ env.CONFIGURATION }} --no-restore
      - name: Test
        run: dotnet test ${{ env.SOLUTION }} --configuration ${{ env.CONFIGURATION }} --no-build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      id-token: write   # OIDC só no job que fala com a Azure
      contents: read
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    env:
      IMAGE: ${{ vars.ACR_REGISTRY_NAME }}.azurecr.io/fcg-order-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build --pull -t $IMAGE .   # --pull: base sempre atualizada, sem cache velho

      # Barra o push se a imagem tiver CVE HIGH/CRITICAL com correção disponível.
      # 0.35.0 é release imutável (posterior ao comprometimento das tags do trivy-action em 03/2026).
      - name: Scan Docker Image (Trivy)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE }}
          version: v0.69.3
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}

      - name: ACR Login
        run: az acr login --name ${{ vars.ACR_REGISTRY_NAME }}

      - name: Push Docker Image to ACR
        run: docker push $IMAGE
