name: CI/CD Fiap Cloud Games - Order Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Um run por branch: em PR o novo cancela o antigo; na main o deploy em andamento termina antes do próximo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 9.0.x
  SOLUTION: Fcg.Orders.sln
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name:  Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Restore 
        run: dotnet restore ${{ env.SOLUTION }}
      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration ${{ env.CONFIGURATION }} --no-restore
      - name: Test
        run: dotnet test ${{ env.SOLUTION }} --configuration ${{ env.CONFIGURATION }} --no-build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      id-token: write   # OIDC só no job que fala com a Azure
      contents: read
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    env:
      IMAGE: ${{ vars.ACR_REGISTRY_NAME }}.azurecr.io/fcg-order-api:${{ github.sha }}
      NAMESPACE: default
      DEPLOYMENT: fcg-orders-api-deployment
      MIGRATION_JOB: fcg-order-db-migration
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build --pull -t $IMAGE .   # --pull: base sempre atualizada, sem cache velho

      - name: Scan Docker Image (Trivy)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE }}
          version: v0.69.3
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}

      - name: ACR Login
        run: az acr login --name ${{ vars.ACR_REGISTRY_NAME }}

      - name: Push Docker Image to ACR
        run: docker push $IMAGE
      
      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }} 

      - name: Apply ConfigMap
        run: kubectl apply -n "$NAMESPACE" -f k8s/order-configmap.yaml
      
      - name: Run DB migration
        run: |
          kubectl delete job "$MIGRATION_JOB" -n "$NAMESPACE" --ignore-not-found --wait=true
          yq '.spec.template.spec.containers[0].image = strenv(IMAGE)' k8s/order-migration.yaml \
            | kubectl apply -n "$NAMESPACE" -f -
          
          for i in $(seq 1 95); do
            status=$(kubectl get job "$MIGRATION_JOB" -n "$NAMESPACE" \
              -o jsonpath='{.status.conditions[?(@.status=="True")].type}')
            case "$status" in
              *Complete*) echo "Migração concluída"; exit 0 ;;
              *Failed*)
                kubectl logs job/"$MIGRATION_JOB" -n "$NAMESPACE" --all-containers --tail=200
                exit 1 ;;
            esac
            sleep 10
          done
          echo "Migração não terminou a tempo"; exit 1  

      - name: Deploy to AKS
        run: |
          yq '(select(.kind == "Deployment") | .spec.template.spec.containers[0].image) = strenv(IMAGE)' k8s/order.yaml \
            | kubectl apply -n "$NAMESPACE" -f -
          kubectl annotate deployment/"$DEPLOYMENT" -n "$NAMESPACE" \
            kubernetes.io/change-cause="fcg-order-api ${{ github.sha }}" --overwrite
          if ! kubectl rollout status deployment/"$DEPLOYMENT" -n "$NAMESPACE" --timeout=5m; then
            echo "Rollout falhou, desfazendo"
            kubectl rollout undo deployment/"$DEPLOYMENT" -n "$NAMESPACE"
            kubectl rollout status deployment/"$DEPLOYMENT" -n "$NAMESPACE" --timeout=5m
            exit 1
          fi      
        
        
     
