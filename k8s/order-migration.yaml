apiVersion: batch/v1
kind: Job
metadata:
  name: fcg-order-db-migration
  labels:
    app: fcg-order-db-migration
spec:
  ttlSecondsAfterFinished: 120
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: Never
      initContainers:
      - name: wait-for-sql
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            until nc -w 2 "$DB_SERVER" "$DB_PORT" < /dev/null 2>/dev/null; do
              echo "aguardando $DB_SERVER:$DB_PORT..."
              sleep 3
            done
        env:
          - name: DB_SERVER
            valueFrom:
              configMapKeyRef:
                name: order-config
                key: DB_SERVER
          - name: DB_PORT
            valueFrom:
              configMapKeyRef:
                name: order-config
                key: DB_PORT
        resources:
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            cpu: "50m"
            memory: "32Mi"
      containers:
      - name: migration-order-runner
        image: acrfiapcloudgames.azurecr.io/fcg-order-api:1.2
        imagePullPolicy: Always
        command: ["./efbundle"]
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
        env:
          - name: DatabaseSettings__Host
            valueFrom:
              configMapKeyRef:
                name: order-config
                key: DB_SERVER
          - name: DatabaseSettings__Port
            valueFrom:
              configMapKeyRef:
                name: order-config
                key: DB_PORT
          - name: DatabaseSettings__DatabaseName
            valueFrom:
              configMapKeyRef:
                name: order-config
                key: DB_NAME
          - name: DatabaseSettings__Username
            valueFrom:
              secretKeyRef:
                name: fcg-secrets
                key: DB_USER
          - name: DatabaseSettings__Password
            valueFrom:
              secretKeyRef:
                name: fcg-secrets
                key: DB_PASS
        volumeMounts:
          - name: secrets-store
            mountPath: /mnt/secrets
            readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: fcg-kv
         